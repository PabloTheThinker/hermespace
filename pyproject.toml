[project]
name = "hermespace"
version = "0.19.0"
description = "Functional J-Space workbench for Hermes Agent — FOA desk, Cube heart integration, dual decode, autonomy grid"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/PabloTheThinker/hermespace"
Repository = "https://github.com/PabloTheThinker/hermespace"
Issues = "https://github.com/PabloTheThinker/hermespace/issues"
Documentation = "https://github.com/PabloTheThinker/hermespace#documentation"

[project.scripts]
hermespace = "hermespace.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
