name: hermespace
version: "0.24.0"
description: >
  Hermespace Access Engine for Hermes agents — open-source GWT harness
  (report/modulate/silent-reason/broadcast/selectivity), OEW ON by default,
  dual decode, optional warehouse. Hooks: on_session_start, pre_llm_call,
  on_session_end. Set HERMESPACE_ROOT to checkout.
author: Hermespace contributors
kind: standalone
hooks:
  - on_session_start
  - pre_llm_call
  - on_session_end
homepage: https://github.com/PabloTheThinker/hermespace
