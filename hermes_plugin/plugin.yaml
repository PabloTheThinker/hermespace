name: hermespace
version: "0.20.0"
description: >
  Hermespace true J-Space environment for Hermes agents — external observable
  workspace (lens/audit/reflect), Cube heart/center (standalone-safe), dual
  decode. Hooks: on_session_start, pre_llm_call, on_session_end.
  Set HERMESPACE_ROOT to checkout.
author: Hermespace contributors
kind: standalone
hooks:
  - on_session_start
  - pre_llm_call
  - on_session_end
homepage: https://github.com/PabloTheThinker/hermespace
