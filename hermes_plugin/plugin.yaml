name: hermespace
version: "0.21.0"
description: >
  Hermespace OEW J-Space for Hermes agents — obligatory external workspace
  for higher-order thinking (lens/audit/reflect/auto-park), Cube heart
  (standalone-safe), dual decode. Hooks: on_session_start, pre_llm_call,
  on_session_end. HERMESPACE_OEW=1 by default. Set HERMESPACE_ROOT to checkout.
author: Hermespace contributors
kind: standalone
hooks:
  - on_session_start
  - pre_llm_call
  - on_session_end
homepage: https://github.com/PabloTheThinker/hermespace
