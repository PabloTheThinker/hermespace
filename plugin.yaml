manifest_version: 1
name: hermespace
version: "0.25.0"
description: >
  Production Access Engine for Hermes Agent v0.20+: session-scoped workspace,
  bounded model context, native lifecycle telemetry, dual decode, and
  standalone-safe persistence.
author: Hermespace contributors
kind: standalone
hooks:
  - on_session_start
  - pre_llm_call
  - post_llm_call
  - post_tool_call
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - subagent_start
  - subagent_stop
homepage: https://github.com/PabloTheThinker/hermespace
